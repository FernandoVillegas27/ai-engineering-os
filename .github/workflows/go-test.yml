name: Go tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Go verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Run tests
        run: go test ./...

      - name: Run race tests
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Build all packages
        run: go build ./...

      - name: Vet all packages
        run: go vet ./...

      - name: Doctor smoke test
        run: go run ./cmd/ai doctor
