name: IntelliJ client

on:
  pull_request:
    paths:
      - "clients/intellij/**"
      - ".github/workflows/intellij-client.yml"
  push:
    branches:
      - master
    paths:
      - "clients/intellij/**"
      - ".github/workflows/intellij-client.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Unit tests and plugin build
        run: gradle -p clients/intellij test buildPlugin verifyPluginProjectConfiguration --no-daemon
