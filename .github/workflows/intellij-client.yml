name: IntelliJ client

on:
  pull_request:
    paths:
      - "clients/intellij/**"
      - ".github/workflows/intellij-client.yml"
      - "scripts/build-intellij-release.sh"
  push:
    branches:
      - master
    paths:
      - "clients/intellij/**"
      - ".github/workflows/intellij-client.yml"
      - "scripts/build-intellij-release.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Unit tests and installable plugin build
        env:
          VERSION: 0.1.0-rc.1
          OUT_DIR: dist
        run: bash scripts/build-intellij-release.sh
      - name: Upload IntelliJ plugin evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-engineering-os-intellij
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
