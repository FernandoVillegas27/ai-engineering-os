name: VS Code client

on:
  pull_request:
    paths:
      - "clients/vscode/**"
      - ".github/workflows/vscode-client.yml"
      - "scripts/build-vscode-release.sh"
  push:
    branches:
      - master
    paths:
      - "clients/vscode/**"
      - ".github/workflows/vscode-client.yml"
      - "scripts/build-vscode-release.sh"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax
        working-directory: clients/vscode
        run: npm run check
      - name: Unit tests
        working-directory: clients/vscode
        run: npm test
      - name: Build installable VSIX and checksum
        env:
          VERSION: 0.1.0-rc.1
          OUT_DIR: dist
        run: bash scripts/build-vscode-release.sh
      - name: Upload VSIX evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai-engineering-os-vscode
          path: |
            dist/*.vsix
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
